# Nawara Admin static hosting (behind Traefik, which terminates TLS). Deep links fall back to index.html; a missing file
# with an extension is a real 404, never the application shell.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  charset utf-8;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/plain;

  # Liveness for the container health check (and the deploy's rollback decision).
  location = /healthz {
    access_log off;
    default_type text/plain;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store";
    return 200 "ok\n";
  }

  # The deployed commit, for deployment verification.
  location = /version.txt {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # The application shell: always revalidated, so a deployment takes effect immediately.
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  # Content-hashed build output (outputHashing: all): bundles, chunks, styles and fonts never change under one name.
  location ~* ^/(?:[^/]+\.(?:js|css)|media/.+)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Other files (brand artwork, illustrations, icons, manifest): stable names, so a short cache.
  location ~ \.[A-Za-z0-9]+$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # Client-side routes (/login, /overview, /platforms/…): the application shell.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
