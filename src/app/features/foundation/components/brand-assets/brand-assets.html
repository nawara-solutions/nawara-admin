<h2 id="brand-title" class="brand-assets__heading">
  {{ 'foundation.sections.brand' | transloco }}
</h2>
<p class="brand-assets__note">{{ 'foundation.brand.note' | transloco }}</p>
<div class="brand-assets__panels">
  @for (theme of themes; track theme) {
    <div class="brand-assets__panel" [attr.data-theme]="theme">
      <figure class="brand-assets__figure brand-assets__figure--wide">
        <nw-brand-mark class="brand-assets__full" [label]="'brand.logoLabel' | transloco" full />
        <figcaption>{{ 'foundation.brand.full' | transloco }}</figcaption>
      </figure>
      <figure class="brand-assets__figure">
        <nw-brand-mark
          class="brand-assets__wordmark"
          [label]="'brand.logoLabel' | transloco"
          wordmark
        />
        <figcaption>{{ 'foundation.brand.wordmark' | transloco }}</figcaption>
      </figure>
      <figure class="brand-assets__figure">
        <img
          class="brand-assets__symbol"
          [src]="
            theme === 'light' ? 'brand/nawara-flower-coral.svg' : 'brand/nawara-flower-glow.svg'
          "
          alt=""
          width="480"
          height="300"
        />
        <figcaption>{{ 'foundation.brand.symbol' | transloco }}</figcaption>
      </figure>
      <figure class="brand-assets__figure">
        <span class="brand-assets__favicons">
          @for (size of faviconSizes; track size) {
            <img src="favicon.svg" alt="" [width]="size" [height]="size" />
          }
        </span>
        <figcaption>{{ 'foundation.brand.favicons' | transloco }}</figcaption>
      </figure>
    </div>
  }
</div>
