# Security headers are sent on every response (`always`). Cache-Control, set per location, is not `always`: nginx then
# sends it only on successful responses, so a 404 is never cached as immutable.
# Included in every location (nginx does not inherit add_header into a location that sets its own).
# A Content-Security-Policy is deliberately not set yet: it needs the hash of index.html's no-flash script and the Core
# origins, and is planned with production integration (docs/ARCHITECTURE.md §21, A14).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
