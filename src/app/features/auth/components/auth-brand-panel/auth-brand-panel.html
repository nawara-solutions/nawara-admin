<div class="auth-brand-panel__decor" aria-hidden="true">
  <span class="auth-brand-panel__flora"></span>
  <span class="auth-brand-panel__hero-flora"></span>
  <span class="auth-brand-panel__orbit"></span>
  <span class="auth-brand-panel__orbit auth-brand-panel__orbit--inner"></span>
</div>
<nw-brand-mark class="auth-brand-panel__logo" [label]="'brand.logoLabel' | transloco" lockup />
<div class="auth-brand-panel__intro">
  <p class="auth-brand-panel__eyebrow">{{ 'auth.brand.product' | transloco }}</p>
  <p class="auth-brand-panel__tagline">{{ 'auth.brand.tagline' | transloco }}</p>
  <p class="auth-brand-panel__line">{{ 'auth.brand.line' | transloco }}</p>
</div>
<p class="auth-brand-panel__copyright">{{ 'auth.brand.copyright' | transloco }}</p>
