<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Nawara">
  <!--
    Nawara flower symbol: VECTOR RECONSTRUCTION, PROVISIONAL.
    Redrawn from the Nawara Solutions brand board (a 1536x1024 raster); it is not the official artwork.
    Geometry measured on the board: six petals 60 degrees apart, each a lens from 0.08 R to the tip with a maximum
    half-width of about 0.23 R, two-toned along its midrib. Colours are pixel samples from the board (approximate).
    Replace this file with the official vector symbol when it is supplied (docs/BRAND.md).
  -->
  <defs>
    <linearGradient id="nw-petal-light" gradientUnits="userSpaceOnUse" x1="50" y1="50" x2="50" y2="3">
      <stop offset="0.10" stop-color="#FFF6DF" />
      <stop offset="0.30" stop-color="#FEB86F" />
      <stop offset="0.45" stop-color="#FD6251" />
      <stop offset="0.60" stop-color="#F43A70" />
      <stop offset="0.75" stop-color="#EA3793" />
      <stop offset="0.92" stop-color="#DE33A0" />
      <stop offset="1" stop-color="#DC30A1" />
    </linearGradient>
    <linearGradient id="nw-petal-shade" gradientUnits="userSpaceOnUse" x1="50" y1="50" x2="50" y2="3">
      <stop offset="0.10" stop-color="#FEE9C2" />
      <stop offset="0.30" stop-color="#FE9F55" />
      <stop offset="0.45" stop-color="#FE6451" />
      <stop offset="0.60" stop-color="#EF3260" />
      <stop offset="0.75" stop-color="#DD2883" />
      <stop offset="0.92" stop-color="#C92492" />
      <stop offset="1" stop-color="#CB2496" />
    </linearGradient>
    <radialGradient id="nw-glow" gradientUnits="userSpaceOnUse" cx="50" cy="50" r="12">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="0.42" stop-color="#FFFDF4" />
      <stop offset="0.7" stop-color="#FFE3A6" stop-opacity="0.7" />
      <stop offset="1" stop-color="#FFC96B" stop-opacity="0" />
    </radialGradient>
    <g id="nw-petal">
      <path d="M50 46.2 C41 38.5 31 15 50 3 Z" fill="url(#nw-petal-light)" />
      <path d="M50 46.2 C59 38.5 69 15 50 3 Z" fill="url(#nw-petal-shade)" />
    </g>
  </defs>
  <use href="#nw-petal" />
  <use href="#nw-petal" transform="rotate(60 50 50)" />
  <use href="#nw-petal" transform="rotate(120 50 50)" />
  <use href="#nw-petal" transform="rotate(180 50 50)" />
  <use href="#nw-petal" transform="rotate(240 50 50)" />
  <use href="#nw-petal" transform="rotate(300 50 50)" />
  <circle cx="50" cy="50" r="12" fill="url(#nw-glow)" />
</svg>
