<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" color="#046efa">
  <!--
    Nawara Admin favicon master (B2, Option A "Faithful simplification", owner selection 2026-11-01).
    A favicon-specific optical redraw of the approved Admin symbol (docs/BRAND.md §B1), drawn by hand on a 64-unit grid
    (16 px x 4) from the symbol's measured layout: the two circuit branches with ring nodes (strokes thickened), the large
    right petal, the two lower petals and a simplified users glyph. NOT the official vector master of the logo (none
    exists yet) and not a trace. The botanical colour is `currentColor`: tools/brand/export_favicon.mjs sets it per accent
    palette; this master shows the brand blue #046efa. The users glyph (class "detail") is white here; the export paints it
    with the palette's pictogram token (--nw-logo-detail: white or the logo's navy, whichever is clearer on the leaf).
  -->
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="24" r="4.6" stroke-width="3"/>
    <circle cx="20" cy="14.5" r="4.4" stroke-width="3"/>
    <path d="M20 19v14" stroke-width="2.8"/>
    <path d="M11.2 27.6 21.6 39.4c1.2 1.6 1.6 3.6 1.6 6.4" stroke-width="2.8"/>
  </g>
  <g fill="currentColor">
    <path d="M26 40C24.6 30 28 20 36 14 43 9 52 7.6 61.6 7.6 61.6 15.4 59.4 24 55 29.6 51 34.2 44 36 37 35.8 32 35.7 28.4 36.8 26 40Z"/>
    <path d="M24.6 47C27.6 41.6 31.8 39.4 37.6 38.2 36 42.4 31.4 45.4 24.6 47Z"/>
    <path d="M14.6 57.2C16.6 50.4 22.6 46.8 31.6 46.4 28.8 51.6 23 55.4 14.6 57.2Z"/>
  </g>
  <g class="detail" fill="#ffffff">
