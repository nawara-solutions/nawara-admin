<!--
  The floral-R artwork of the owner's branding board, as rasters per theme and accent palette: the wordmark
  (--nw-logo-wordmark) and the complete floral R alone (--nw-logo-symbol). "SOLUTIONS" is live text.
-->
@if (lettered()) {
  <span class="nw-brand-mark__word" aria-hidden="true"></span>
  @if (full()) {
    <span class="nw-brand-mark__solutions" aria-hidden="true">
      <span class="nw-brand-mark__rule"></span>
      <span class="nw-brand-mark__solutions-text">SOLUTIONS</span>
      <span class="nw-brand-mark__rule"></span>
    </span>
  } @else if (inline()) {
    <span class="nw-brand-mark__separator" aria-hidden="true"></span>
    <span class="nw-brand-mark__solutions-text" aria-hidden="true">SOLUTIONS</span>
  }
} @else {
  <span class="nw-brand-mark__symbol" aria-hidden="true"></span>
}
