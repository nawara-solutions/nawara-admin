<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Nawara Admin</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- Brand icons (docs/BRAND.md). theme-color mirrors --nw-surface-page of each theme. -->
    <meta name="theme-color" content="#faf8f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17131f" media="(prefers-color-scheme: dark)" />
    <!--
      Favicon: the bloom of the Logo Kit, the ink circle in dark appearance and the paper circle in light appearance.
      One icon link only, so no other icon competes with it; its file follows the accent palette and the resolved
      appearance (set below, then by ThemeService). Browsers without SVG favicons still request /favicon.ico.
    -->
    <link id="nw-favicon" rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!--
      No-flash preferences (docs/ARCHITECTURE.md §14): applies the stored theme, accent palette and locale direction
      before first paint.
      Keys mirror src/app/core/preferences/preference-store.ts. Allowed by a CSP hash, never 'unsafe-inline' (§21, A14).
    -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var theme = localStorage.getItem('nw.theme');
          if (theme === 'light' || theme === 'dark') root.setAttribute('data-theme', theme);
          var dark =
            theme === 'dark' ||
            (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var accent = localStorage.getItem('nw.accent');
          if (/^(rose|plum|indigo|teal|amber)$/.test(accent || ''))
            root.setAttribute('data-accent', accent);
          else accent = 'coral';
          document.getElementById('nw-favicon').href = dark
            ? accent === 'coral'
              ? 'favicon.svg'
              : 'icons/favicon-' + accent + '.svg'
            : 'icons/favicon-' + accent + '-light.svg';
          var locale = localStorage.getItem('nw.locale');
          if (locale === 'en' || locale === 'fr' || locale === 'ar') {
            root.lang = locale;
            root.dir = locale === 'ar' ? 'rtl' : 'ltr';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <adm-root></adm-root>
  </body>
</html>
