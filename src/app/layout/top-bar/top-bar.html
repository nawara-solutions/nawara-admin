<div class="top-bar__navigation">
  @if (showMenuButton()) {
    <button
      #menuButton
      nw-icon-button
      type="button"
      icon="menu"
      class="top-bar__menu"
      aria-controls="shell-navigation"
      [attr.aria-expanded]="menuExpanded()"
      [label]="'shell.openNavigation' | transloco"
      (click)="menuRequested.emit()"
    ></button>
  }
  <adm-breadcrumbs class="top-bar__breadcrumbs" />
</div>

<div class="top-bar__tools">
  <adm-notification-center />
  <span class="top-bar__separator" aria-hidden="true"></span>
  <adm-context-switcher />
  @if (profile(); as person) {
    <span class="top-bar__separator" aria-hidden="true"></span>
    <button
      type="button"
      class="top-bar__avatar"
      [nwMenuTriggerFor]="accountMenu"
      [attr.aria-label]="
        'shell.account.trigger'
          | transloco: { name: person.name, role: (person.roleKey | transloco) }
      "
      [attr.aria-busy]="signingOut() || null"
      [attr.aria-disabled]="signingOut() || null"
    >
      <span aria-hidden="true">{{ person.initials }}</span>
    </button>
  }
</div>

<ng-template #accountMenu><adm-account-menu /></ng-template>
<span class="nw-visually-hidden" role="status">
  {{ signingOut() ? ('shell.account.signingOut' | transloco) : '' }}
</span>
