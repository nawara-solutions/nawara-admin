<nw-dialog
  [title]="'settings.security.secretKey.leave.title' | transloco"
  [closeLabel]="'common.close' | transloco"
>
  <p class="leave-secret-key__body" id="leave-secret-key-description">
    {{ 'settings.security.secretKey.leave.body' | transloco }}
  </p>
  <div nwDialogActions>
    <button nw-button variant="danger" type="button" data-leave (click)="leave()">
      {{ 'settings.security.secretKey.leave.leave' | transloco }}
    </button>
    <button nw-button variant="secondary" type="button" data-stay (click)="stay()">
      {{ 'settings.security.secretKey.leave.stay' | transloco }}
    </button>
  </div>
</nw-dialog>
