<div class="overview-header__titles">
  <h1 class="nw-page-title overview-header__title">{{ 'companyOverview.title' | transloco }}</h1>
</div>
<div class="overview-header__actions">
  @if (isDemo()) {
    <div class="overview-header__demo">
      <button
        type="button"
        class="overview-header__chip overview-header__chip--demo"
        aria-controls="demo-information"
        [attr.aria-expanded]="demoInfoOpen()"
        (click)="demoInfoOpen.set(!demoInfoOpen())"
      >
        <nw-icon name="flask-conical" size="sm" />
        {{ 'shell.demo.badge' | transloco }}
        <span class="nw-visually-hidden">{{ 'shell.demo.about' | transloco }}</span>
      </button>
      <div
        id="demo-information"
        class="overview-header__demo-panel"
        role="region"
        [attr.aria-label]="'shell.demo.about' | transloco"
        [hidden]="!demoInfoOpen()"
      >
        <p>{{ 'shell.demo.explanation' | transloco }}</p>
      </div>
    </div>
  }
  <button
    type="button"
    class="overview-header__chip overview-header__chip--period"
    [nwMenuTriggerFor]="periodMenu"
    [attr.aria-label]="
      ('companyOverview.periodLabel' | transloco) +
      ': ' +
      ((periodDays() === 1 ? 'companyOverview.today' : 'companyOverview.period')
        | transloco: { days: periodDays() })
    "
  >
    <span class="overview-header__period-icon"><nw-icon name="calendar" size="sm" /></span>
    <span class="overview-header__period-label">{{
      (periodDays() === 1 ? 'companyOverview.today' : 'companyOverview.period')
        | transloco: { days: periodDays() }
    }}</span>
    <span class="overview-header__period-chevron"><nw-icon name="chevron-down" size="sm" /></span>
  </button>
  <ng-template #periodMenu>
    <nw-menu
      class="overview-header__period-menu"
      [attr.aria-label]="'companyOverview.periodLabel' | transloco"
    >
      <span class="overview-header__period-heading" aria-hidden="true">{{
        'companyOverview.periodLabel' | transloco
      }}</span>
      @for (days of periods; track days) {
        <button
          type="button"
          cdkMenuItemRadio
          class="overview-header__period-option"
          [attr.data-period]="days"
          [cdkMenuItemChecked]="days === periodDays()"
          (cdkMenuItemTriggered)="periodChange.emit(days)"
        >
          <span class="overview-header__option-icon"><nw-icon name="calendar" size="sm" /></span>
          <span>{{
            (days === 1 ? 'companyOverview.today' : 'companyOverview.period')
              | transloco: { days: days }
          }}</span>
          @if (days === periodDays()) {
            <nw-icon class="overview-header__period-check" name="check" size="sm" />
          }
        </button>
      }
    </nw-menu>
  </ng-template>
</div>
