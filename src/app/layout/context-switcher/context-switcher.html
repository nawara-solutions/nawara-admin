<button
  class="context-switcher__trigger"
  type="button"
  [nwMenuTriggerFor]="scopes"
  [attr.aria-label]="
    'shell.context.scopeTrigger'
      | transloco: { scope: currentPlatform()?.name ?? ('shell.context.allPlatforms' | transloco) }
  "
>
  <!-- The company's logo symbol, in the palette's colours; decorative (the button's label names the scope). -->
  <nw-product-symbol
    class="context-switcher__symbol"
    [product]="currentPlatform()?.product ?? null"
  />
  <span class="context-switcher__text">
    <bdi class="context-switcher__company">{{ companyName() ?? (titleKey() | transloco) }}</bdi>
    <span class="context-switcher__scope">
      @if (currentPlatform(); as platform) {
        <bdi>{{ platform.name }}</bdi>
      } @else {
        {{ 'shell.context.allPlatforms' | transloco }}
      }
    </span>
  </span>
  <span class="context-switcher__chevron" aria-hidden="true">
    <nw-icon name="chevron-down" size="sm" />
  </span>
</button>

<ng-template #scopes>
  <nw-menu class="context-switcher__menu">
    @if (hasCompanyScope()) {
      <button
        nw-menu-item
        class="context-switcher__item"
        [attr.aria-current]="context.scope().kind === 'company' ? 'true' : null"
        (triggered)="selectCompany()"
      >
        <nw-product-symbol />
        <span class="context-switcher__option">
          <bdi class="context-switcher__option-title">{{
            companyName() ?? (titleKey() | transloco)
          }}</bdi>
          <span class="context-switcher__description">{{
            'shell.context.allPlatforms' | transloco
          }}</span>
        </span>
        @if (context.scope().kind === 'company') {
          <nw-icon class="context-switcher__selected" name="check" size="sm" />
          <span class="nw-visually-hidden">({{ 'shell.context.current' | transloco }})</span>
        }
      </button>
    }
    @for (platform of platforms(); track platform.id) {
      <button
        nw-menu-item
        class="context-switcher__item"
        [attr.aria-current]="currentPlatform()?.id === platform.id ? 'true' : null"
        (triggered)="selectPlatform(platform)"
      >
        <nw-product-symbol [product]="platform.product" />
        <span class="context-switcher__option">
          <bdi class="context-switcher__option-title">{{ platform.name }}</bdi>
          @if (platform.product; as product) {
            <span class="context-switcher__description">{{
              productDescriptionKeys[product] | transloco
            }}</span>
          }
        </span>
        @if (currentPlatform()?.id === platform.id) {
          <nw-icon class="context-switcher__selected" name="check" size="sm" />
          <span class="nw-visually-hidden">({{ 'shell.context.current' | transloco }})</span>
        }
      </button>
    }
  </nw-menu>
</ng-template>
