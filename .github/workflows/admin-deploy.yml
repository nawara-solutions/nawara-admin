name: Admin production deploy

# Builds the production image of the selected commit, pushes it to GHCR as sha-<commit>, deploys it to the VPS behind
# Traefik at https://admin.nawara-solutions.com (deploy/provision-and-deploy.sh, streamed from the image), then checks the
# live site. Never runs for pull requests, so deployment secrets never reach untrusted code.
#
# Triggers:
#   - normal:  gh workflow run admin-deploy.yml --ref main                      (main only; guarded below)
#   - rollback: gh workflow run admin-deploy.yml --ref main -f image_sha=<commit>  (redeploys an image already built)
#   - a reviewed commit not yet on main (the initial deployment): push a tag `admin-deploy-<name>` on that commit. Tags
#     run the workflow from the tagged commit itself; pushing one requires write access, like a manual run.
#
# Secrets: the org-level DEPLOY_SSH_HOST / DEPLOY_SSH_USER / DEPLOY_SSH_PASSWORD / DEPLOY_SSH_PORT (the Nawara Core
# convention). The frontend itself needs no secret: everything in the bundle is public. The private
# @nawara-solutions/design-tokens package installs with the job's GITHUB_TOKEN (packages: read), passed to the image
# build as a BuildKit secret, never in a layer.
on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: 'Rollback: full commit SHA of an image already in GHCR to redeploy (leave empty to build this ref)'
        required: false
        default: ''
  push:
    tags: ['admin-deploy-*']

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nawara-admin-web
  PUBLIC_URL: https://admin.nawara-solutions.com

jobs:
  validate:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/admin-deploy-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - run: npm ci --no-audit --no-fund
        env:
          HUSKY: '0'
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run validate

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    # One production deployment of Admin at a time; a running deployment is never cancelled, a newer one waits.
    concurrency:
      group: production-deploy-admin
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: select the image
        id: image
        env:
          ROLLBACK_SHA: ${{ inputs.image_sha }}
        run: |
          sha="${ROLLBACK_SHA:-$GITHUB_SHA}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "image_sha must be a full 40-character commit SHA" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ref=$IMAGE_NAME:sha-$sha" >> "$GITHUB_OUTPUT"
          [ -n "$ROLLBACK_SHA" ] && echo "build=false" >> "$GITHUB_OUTPUT" || echo "build=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
        if: steps.image.outputs.build == 'true'
      - uses: docker/build-push-action@v7
        if: steps.image.outputs.build == 'true'
        with:
          context: .
          push: true
          build-args: REVISION=${{ steps.image.outputs.sha }}
          secrets: npm_token=${{ secrets.GITHUB_TOKEN }}
          tags: ${{ steps.image.outputs.ref }}
      - name: the image to deploy exists
        run: docker manifest inspect "${{ steps.image.outputs.ref }}" >/dev/null
      - name: deploy on the VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,IMAGE
          script: |
            set -euo pipefail
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker pull "$IMAGE"
            docker run --rm --entrypoint cat "$IMAGE" /deploy/provision-and-deploy.sh | IMAGE="$IMAGE" bash -s
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE: ${{ steps.image.outputs.ref }}
      - name: live checks
        run: |
          for _ in $(seq 1 20); do
            [ "$(curl -fsS "$PUBLIC_URL/version.txt" 2>/dev/null)" = "${{ steps.image.outputs.sha }}" ] && break
            sleep 6
          done
          bash deploy/verify.sh "$PUBLIC_URL" "${{ steps.image.outputs.sha }}"
