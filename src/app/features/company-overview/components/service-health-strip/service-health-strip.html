<p class="service-health-strip__live" data-live-health>
  <nw-icon name="info" size="sm" />
  <span>{{ 'coreServices.liveHealth.unavailable' | transloco }}</span>
</p>
<ul class="service-health-strip__items" role="list">
  @for (service of inventory().services; track service) {
    <li class="service-health-strip__item">{{ nameKeys[service] | transloco }}</li>
  }
</ul>
