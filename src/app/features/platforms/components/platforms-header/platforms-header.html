<div class="platforms-header__titles">
  <h1 class="nw-page-title platforms-header__title">{{ 'platforms.title' | transloco }}</h1>
</div>
<div class="platforms-header__actions">
  @if (canCreate() && createAvailable()) {
    <button nw-button variant="primary" type="button" (click)="create.emit()">
      <nw-icon name="plus" size="sm" />
      {{ 'companyOverview.create' | transloco }}
    </button>
  } @else if (canCreate()) {
    <span class="platforms-header__create">
      <button
        nw-button
        variant="primary"
        type="button"
        aria-disabled="true"
        aria-describedby="platforms-create-note"
      >
        <nw-icon name="plus" size="sm" />
        {{ 'companyOverview.create' | transloco }}
      </button>
      <span id="platforms-create-note" class="platforms-header__tooltip" role="tooltip">{{
        'platforms.create.unavailable' | transloco
      }}</span>
    </span>
  }
</div>
