<div class="global-search__field" role="search">
  <button
    class="global-search__category"
    type="button"
    [nwMenuTriggerFor]="categoryMenu"
    [attr.aria-label]="'shell.search.categoryLabel' | transloco"
  >
    <nw-icon [name]="categoryIcon(selected())" size="sm" aria-hidden="true" />
    <span>{{ categoryKey(selected()) | transloco }}</span>
    <nw-icon name="chevron-down" size="sm" />
  </button>
  <span class="global-search__divider" aria-hidden="true"></span>
  <nw-icon class="global-search__icon" name="search" size="sm" aria-hidden="true" />
  <input
    class="global-search__input"
    type="search"
    readonly
    [attr.aria-label]="'shell.search.label' | transloco"
    [attr.aria-describedby]="unavailableDescriptionId"
    [placeholder]="'shell.search.placeholder' | transloco"
    [title]="'shell.notAvailableYet' | transloco"
  />
</div>
<span class="nw-visually-hidden" [id]="unavailableDescriptionId">
  {{ 'shell.search.unavailable' | transloco }}
</span>

<button
  #compactTrigger
  class="global-search__compact"
  type="button"
  cdkOverlayOrigin
  #origin="cdkOverlayOrigin"
  aria-haspopup="dialog"
  [attr.aria-label]="'shell.search.open' | transloco"
  [attr.aria-expanded]="open()"
  (click)="$event.stopPropagation(); toggle()"
>
  <nw-icon name="search" size="sm" />
</button>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayViewportMargin]="12"
  [cdkConnectedOverlayPush]="true"
  (attach)="focusSearch()"
  (overlayOutsideClick)="onOverlayClick()"
  (overlayKeydown)="$event.key === 'Escape' && dismiss()"
>
  <div
    class="global-search__popover"
    role="dialog"
    aria-modal="false"
    [attr.aria-label]="'shell.search.label' | transloco"
  >
    <div class="global-search__field global-search__field--popover">
      <button
        class="global-search__category"
        type="button"
        [nwMenuTriggerFor]="categoryMenu"
        [attr.aria-label]="'shell.search.categoryLabel' | transloco"
      >
        <nw-icon [name]="categoryIcon(selected())" size="sm" aria-hidden="true" />
        <span>{{ categoryKey(selected()) | transloco }}</span>
        <nw-icon name="chevron-down" size="sm" />
      </button>
      <span class="global-search__divider" aria-hidden="true"></span>
      <nw-icon class="global-search__icon" name="search" size="sm" aria-hidden="true" />
      <input
        #searchInput
        class="global-search__input"
        type="search"
        readonly
        [attr.aria-label]="'shell.search.label' | transloco"
        [attr.aria-describedby]="unavailableDescriptionId"
        [placeholder]="'shell.search.placeholder' | transloco"
      />
    </div>
    <p class="global-search__unavailable">{{ 'shell.search.unavailable' | transloco }}</p>
  </div>
</ng-template>

<ng-template #categoryMenu>
  <nw-menu>
    @for (category of categories; track category.id) {
      <button nw-menu-item type="button" (triggered)="select(category.id)">
        <nw-icon [name]="category.icon" size="sm" />
        <span class="global-search__category-option">{{ category.key | transloco }}</span>
        @if (selected() === category.id) {
          <nw-icon name="check" size="sm" />
          <span class="nw-visually-hidden">({{ 'shell.context.current' | transloco }})</span>
        }
      </button>
    }
  </nw-menu>
</ng-template>
