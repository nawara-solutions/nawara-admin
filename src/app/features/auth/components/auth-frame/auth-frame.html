<adm-auth-brand-panel />

<div class="auth-frame__column">
  <span class="auth-frame__corner" aria-hidden="true"></span>
  <header class="auth-frame__header">
    <nw-brand-mark class="auth-frame__header-logo" [label]="'brand.logoLabel' | transloco" lockup />
    <adm-preference-menus framed />
  </header>

  <main class="auth-frame__main">
    <p class="nw-visually-hidden" role="status" aria-live="polite">
      @if (flow.announcement(); as key) {
        {{ key | transloco }}
      }
    </p>

    @if (flow.step() === 'checking') {
      <adm-auth-card
        centered
        step="checking"
        [title]="'auth.checking.title' | transloco"
        [subtitle]="'auth.checking.subtitle' | transloco"
      >
        <div class="auth-frame__checking"><nw-spinner size="lg" /></div>
      </adm-auth-card>
    }
    <!-- Hidden, never destroyed, while access is checked: re-creating the outlet would re-activate the step's page. -->
    <div class="auth-frame__outlet" [class.auth-frame__outlet--hidden]="flow.step() === 'checking'">
      <router-outlet />
    </div>

    @if (demo(); as hint) {
      <aside
        adm-auth-demo-note
        [hint]="hint"
        [attr.aria-label]="'auth.demo.title' | transloco"
      ></aside>
    }

    <div class="auth-frame__footer">
      <p class="auth-frame__footer-tagline">{{ 'auth.brand.tagline' | transloco }}</p>
      <p class="auth-frame__footer-copyright">{{ 'auth.brand.copyright' | transloco }}</p>
    </div>
  </main>
</div>
