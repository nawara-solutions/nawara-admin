<button
  class="preference-menus__trigger"
  type="button"
  [nwMenuTriggerFor]="languages"
  [attr.aria-label]="('preferences.language.label' | transloco) + ': ' + currentLanguage()"
>
  <nw-icon name="globe" size="sm" />
  @if (framed()) {
    <span class="preference-menus__value" aria-hidden="true">{{ currentLanguage() }}</span>
    <nw-icon class="preference-menus__chevron" name="chevron-down" size="sm" />
  } @else {
    <span class="preference-menus__value" aria-hidden="true">{{
      locale.locale() | uppercase
    }}</span>
    <nw-icon class="preference-menus__chevron" name="chevron-down" size="sm" />
  }
</button>
<ng-template #languages>
  <nw-menu
    class="preference-menus__language-menu"
    [attr.aria-label]="'preferences.language.label' | transloco"
  >
    @for (option of locales; track option.value) {
      <button
        nw-menu-item
        class="preference-menus__language-item"
        [attr.aria-current]="locale.locale() === option.value ? 'true' : null"
        (triggered)="setLocale(option.value)"
      >
        <span class="preference-menus__language-code" aria-hidden="true">{{
          option.value | uppercase
        }}</span>
        <bdi class="preference-menus__option" [attr.lang]="option.value">{{ option.name }}</bdi>
        @if (locale.locale() === option.value) {
          <nw-icon class="preference-menus__selected" name="check" size="sm" />
        }
      </button>
    }
  </nw-menu>
</ng-template>

<adm-appearance-menu [framed]="framed()" />
