<div class="auth-brand-panel__decor" aria-hidden="true">
  <span class="auth-brand-panel__glow"></span>
  <span class="auth-brand-panel__botanical"></span>
</div>
<nw-brand-mark
  class="auth-brand-panel__logo"
  [label]="'brand.adminLogoLabel' | transloco"
  wordmark
/>
<div class="auth-brand-panel__intro">
  <!-- Spans only (no loose text): the tagline is pre-line, so template whitespace must not reach it. -->
  <p class="auth-brand-panel__tagline">
    <span>{{ 'auth.brand.taglineLead' | transloco }}</span>
    <span class="auth-brand-panel__tagline-emphasis">{{
      'auth.brand.taglineEmphasis' | transloco
    }}</span>
  </p>
  <p class="auth-brand-panel__line">{{ 'auth.brand.line' | transloco }}</p>
</div>
<!-- Isolated: the Latin company line keeps its own order ("© 2026 Nawara Solutions") on an Arabic page. -->
<p class="auth-brand-panel__copyright">
  <bdi>{{ 'auth.brand.copyrightCompany' | transloco }}</bdi>
</p>
