<button
  class="context-switcher__trigger"
  type="button"
  [nwMenuTriggerFor]="scopes"
  [attr.aria-label]="
    'shell.context.scopeTrigger'
      | transloco: { scope: currentPlatform()?.name ?? ('shell.context.allPlatforms' | transloco) }
  "
>
  <!-- The company's logo symbol, in the palette's colours; decorative (the button's label names the scope). -->
  <nw-product-symbol
    class="context-switcher__symbol"
    [product]="currentPlatform()?.product ?? null"
  />
  <span class="context-switcher__text">
    <bdi class="context-switcher__company">{{ companyName() ?? (titleKey() | transloco) }}</bdi>
    <span class="context-switcher__scope">
      @if (currentPlatform(); as platform) {
        <bdi>{{ platform.name }}</bdi>
      } @else {
        {{ 'shell.context.allPlatforms' | transloco }}
      }
    </span>
  </span>
  <nw-icon class="context-switcher__chevron" name="chevron-down" size="sm" />
</button>

<ng-template #scopes>
  <nw-menu class="context-switcher__menu">
    @if (hasCompanyScope()) {
      <button nw-menu-item (triggered)="selectCompany()">
        <nw-product-symbol />
        <span class="context-switcher__option">{{ 'shell.context.allPlatforms' | transloco }}</span>
        @if (context.scope().kind === 'company') {
          <nw-icon name="check" size="sm" />
          <span class="nw-visually-hidden">({{ 'shell.context.current' | transloco }})</span>
        }
      </button>
    }
    @if (platforms().length > 0) {
      <p class="context-switcher__group" aria-hidden="true">
        {{ 'shell.context.platforms' | transloco }}
      </p>
    }
    @for (platform of platforms(); track platform.id) {
      <button nw-menu-item (triggered)="selectPlatform(platform)">
        <nw-product-symbol [product]="platform.product" />
        <bdi class="context-switcher__option">{{ platform.name }}</bdi>
        @if (currentPlatform()?.id === platform.id) {
          <nw-icon name="check" size="sm" />
          <span class="nw-visually-hidden">({{ 'shell.context.current' | transloco }})</span>
        }
      </button>
    }
  </nw-menu>
</ng-template>
